syntax = "proto3";

// Identity and access management (spec 03). Global service.
package qstack.iam.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "qstack/api/annotations.proto";
import "qstack/operation/v1/operation.proto";

// User is a person: local (password + TOTP) or federated (OIDC).
message User {
  // `usr-<ulid>`.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Sign-in name: the email address.
  string login = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string display_name = 3;
  // Federation of a federated user; empty for local users.
  string federation_id = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  Status status = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  bool mfa_enabled = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  enum Status {
    STATUS_UNSPECIFIED = 0;
    // Invited or signed up, email not confirmed yet.
    STATUS_PENDING = 1;
    STATUS_ACTIVE = 2;
    // Tokens revoked, sign-in refused (REQ-IAM-003).
    STATUS_BLOCKED = 3;
  }
}

// UserService manages the users of an organization.
service UserService {
  // Returns a user of an organization the caller can see.
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {get: "/iam/v1/users/{user_id}"};
    option (qstack.api.permission) = "iam.users.get";
  }

  // Lists the users of an organization.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {get: "/iam/v1/users"};
    option (qstack.api.permission) = "iam.users.list";
  }

  // Invites a person by email into an organization.
  rpc InviteUser(InviteUserRequest) returns (qstack.operation.v1.Operation) {
    option (google.api.http) = {
      post: "/iam/v1/users:invite"
      body: "*"
    };
    option (qstack.api.permission) = "iam.users.invite";
  }

  // Blocks a user: their tokens are revoked within 10 s (REQ-IAM-003).
  rpc BlockUser(BlockUserRequest) returns (qstack.operation.v1.Operation) {
    option (google.api.http) = {
      post: "/iam/v1/users/{user_id}:block"
      body: "*"
    };
    option (qstack.api.permission) = "iam.users.block";
  }

  // Unblocks a user.
  rpc UnblockUser(UnblockUserRequest) returns (qstack.operation.v1.Operation) {
    option (google.api.http) = {
      post: "/iam/v1/users/{user_id}:unblock"
      body: "*"
    };
    option (qstack.api.permission) = "iam.users.unblock";
  }

  // Removes a user from an organization and its access bindings.
  rpc RemoveUser(RemoveUserRequest) returns (qstack.operation.v1.Operation) {
    option (google.api.http) = {
      post: "/iam/v1/users/{user_id}:remove"
      body: "*"
    };
    option (qstack.api.permission) = "iam.users.remove";
  }

  // Returns the calling user.
  rpc GetSelf(GetSelfRequest) returns (User) {
    option (google.api.http) = {get: "/iam/v1/users:self"};
    option (qstack.api.permission) = "iam.users.getSelf";
  }
}

message GetUserRequest {
  string user_id = 1 [(buf.validate.field).string.pattern = "^usr-[0-9a-hjkmnp-tv-z]{26}$"];
}

message ListUsersRequest {
  string organization_id = 1 [(buf.validate.field).string.pattern = "^org-[0-9a-hjkmnp-tv-z]{26}$"];
  // Default 100, maximum 1000.
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  string page_token = 3 [(buf.validate.field).string.max_len = 2048];
  // Filter on `login`, `status`.
  string filter = 4 [(buf.validate.field).string.max_len = 1024];
}

message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
}

message InviteUserRequest {
  string organization_id = 1 [(buf.validate.field).string.pattern = "^org-[0-9a-hjkmnp-tv-z]{26}$"];
  string email = 2 [(buf.validate.field).string = {
    email: true
    max_len: 254
  }];
}

message InviteUserMetadata {
  // The invited user, created in STATUS_PENDING.
  string user_id = 1;
}

message BlockUserRequest {
  string user_id = 1 [(buf.validate.field).string.pattern = "^usr-[0-9a-hjkmnp-tv-z]{26}$"];
}

message BlockUserMetadata {
  string user_id = 1;
}

message UnblockUserRequest {
  string user_id = 1 [(buf.validate.field).string.pattern = "^usr-[0-9a-hjkmnp-tv-z]{26}$"];
}

message UnblockUserMetadata {
  string user_id = 1;
}

message RemoveUserRequest {
  string user_id = 1 [(buf.validate.field).string.pattern = "^usr-[0-9a-hjkmnp-tv-z]{26}$"];
  string organization_id = 2 [(buf.validate.field).string.pattern = "^org-[0-9a-hjkmnp-tv-z]{26}$"];
}

message RemoveUserMetadata {
  string user_id = 1;
}

message GetSelfRequest {}
