syntax = "proto3";

package qstack.iam.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "qstack/access/v1/access.proto";
import "qstack/api/annotations.proto";
import "qstack/operation/v1/operation.proto";

// ServiceAccount is a non-human subject of a project: automation, CI,
// workloads on instances.
message ServiceAccount {
  // `sa-<ulid>`.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string project_id = 2 [(google.api.field_behavior) = IMMUTABLE];
  string name = 3;
  string description = 4;
  map<string, string> labels = 5;
  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  string etag = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ServiceAccountService manages service accounts and who may act as them.
service ServiceAccountService {
  // Returns a service account.
  rpc GetServiceAccount(GetServiceAccountRequest) returns (ServiceAccount) {
    option (google.api.http) = {get: "/iam/v1/serviceAccounts/{service_account_id}"};
    option (qstack.api.permission) = "iam.serviceAccounts.get";
  }

  // Lists the service accounts of a project.
  rpc ListServiceAccounts(ListServiceAccountsRequest) returns (ListServiceAccountsResponse) {
    option (google.api.http) = {get: "/iam/v1/serviceAccounts"};
    option (qstack.api.permission) = "iam.serviceAccounts.list";
  }

  // Creates a service account in a project.
  rpc CreateServiceAccount(CreateServiceAccountRequest) returns (qstack.operation.v1.Operation) {
    option (google.api.http) = {
      post: "/iam/v1/serviceAccounts"
      body: "*"
    };
    option (qstack.api.permission) = "iam.serviceAccounts.create";
  }

  // Updates a service account.
  rpc UpdateServiceAccount(UpdateServiceAccountRequest) returns (qstack.operation.v1.Operation) {
    option (google.api.http) = {
      patch: "/iam/v1/serviceAccounts/{service_account_id}"
      body: "*"
    };
    option (qstack.api.permission) = "iam.serviceAccounts.update";
  }

  // Deletes a service account and revokes its keys and tokens within 10 s
  // (REQ-IAM-025).
  rpc DeleteServiceAccount(DeleteServiceAccountRequest) returns (qstack.operation.v1.Operation) {
    option (google.api.http) = {delete: "/iam/v1/serviceAccounts/{service_account_id}"};
    option (qstack.api.permission) = "iam.serviceAccounts.delete";
  }

  // Lists the access bindings of a service account (who may act as it).
  rpc ListAccessBindings(qstack.access.v1.ListAccessBindingsRequest) returns (qstack.access.v1.ListAccessBindingsResponse) {
    option (google.api.http) = {get: "/iam/v1/serviceAccounts/{resource_id}:listAccessBindings"};
    option (qstack.api.permission) = "iam.serviceAccounts.listAccessBindings";
  }

  // Adds and removes access bindings of a service account.
  rpc UpdateAccessBindings(qstack.access.v1.UpdateAccessBindingsRequest) returns (qstack.operation.v1.Operation) {
    option (google.api.http) = {
      post: "/iam/v1/serviceAccounts/{resource_id}:updateAccessBindings"
      body: "*"
    };
    option (qstack.api.permission) = "iam.serviceAccounts.updateAccessBindings";
  }
}

message GetServiceAccountRequest {
  string service_account_id = 1 [(buf.validate.field).string.pattern = "^sa-[0-9a-hjkmnp-tv-z]{26}$"];
}

message ListServiceAccountsRequest {
  string project_id = 1 [(buf.validate.field).string.pattern = "^prj-[0-9a-hjkmnp-tv-z]{26}$"];
  // Default 100, maximum 1000.
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  string page_token = 3 [(buf.validate.field).string.max_len = 2048];
  // Filter on `name`, `labels.<key>`.
  string filter = 4 [(buf.validate.field).string.max_len = 1024];
}

message ListServiceAccountsResponse {
  repeated ServiceAccount service_accounts = 1;
  string next_page_token = 2;
}

message CreateServiceAccountRequest {
  string project_id = 1 [(buf.validate.field).string.pattern = "^prj-[0-9a-hjkmnp-tv-z]{26}$"];
  string name = 2 [(buf.validate.field).string.pattern = "^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$"];
  string description = 3 [(buf.validate.field).string.max_len = 256];
  map<string, string> labels = 4 [(buf.validate.field).map = {
    max_pairs: 64
    keys: {
      string: {pattern: "^[a-z][a-z0-9_./-]{0,62}$"}
    }
    values: {
      string: {max_len: 63}
    }
  }];
}

message CreateServiceAccountMetadata {
  string service_account_id = 1;
}

message UpdateServiceAccountRequest {
  string service_account_id = 1 [(buf.validate.field).string.pattern = "^sa-[0-9a-hjkmnp-tv-z]{26}$"];
  // Fields to update; empty is INVALID_ARGUMENT (REQ-PLT-030).
  google.protobuf.FieldMask update_mask = 2 [(buf.validate.field).required = true];
  string name = 3 [(buf.validate.field).string.pattern = "^([a-z]([a-z0-9-]{0,61}[a-z0-9])?)?$"];
  string description = 4 [(buf.validate.field).string.max_len = 256];
  map<string, string> labels = 5 [(buf.validate.field).map = {
    max_pairs: 64
    keys: {
      string: {pattern: "^[a-z][a-z0-9_./-]{0,62}$"}
    }
    values: {
      string: {max_len: 63}
    }
  }];
  // Expected etag; a mismatch fails with ABORTED (REQ-PLT-022).
  string etag = 6;
}

message UpdateServiceAccountMetadata {
  string service_account_id = 1;
}

message DeleteServiceAccountRequest {
  string service_account_id = 1 [(buf.validate.field).string.pattern = "^sa-[0-9a-hjkmnp-tv-z]{26}$"];
  string etag = 2;
}

message DeleteServiceAccountMetadata {
  string service_account_id = 1;
}
