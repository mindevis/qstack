syntax = "proto3";

package qstack.iam.internal.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "qstack/api/annotations.proto";

// CredentialService validates credentials for the edge services. Callers
// are allowlisted by their mTLS identity: GetAccessKeySecret only for
// qs-s3-gateway, ValidateApiKey only for qs-api-gateway (spec 03 §6).
service CredentialService {
  // Returns the secret of an S3 access key for SigV4 verification.
  rpc GetAccessKeySecret(GetAccessKeySecretRequest) returns (GetAccessKeySecretResponse);

  // Resolves an API key to its service account and scopes.
  rpc ValidateApiKey(ValidateApiKeyRequest) returns (ValidateApiKeyResponse);
}

message GetAccessKeySecretRequest {
  // AWS-style access key ID, `QS…`.
  string key_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }];
}

message GetAccessKeySecretResponse {
  string secret = 1 [(qstack.api.sensitive) = true];
  // `sa-…` or `usr-…`.
  string subject_id = 2;
  bool active = 3;
}

message ValidateApiKeyRequest {
  string api_key = 1 [
    (buf.validate.field).string.max_len = 128,
    (qstack.api.sensitive) = true
  ];
}

message ValidateApiKeyResponse {
  bool valid = 1;
  string service_account_id = 2;
  repeated string scopes = 3;
  google.protobuf.Timestamp expire_time = 4;
}
