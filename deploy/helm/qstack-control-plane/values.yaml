# qStack control plane. Profiles (spec 15 §3): `single` (one k3s node, one
# replica each) and `ha` (>= 3 nodes; T-1.67).
profile: single

images:
  # qStack images: <registry>/<binary>:<tag>, published from main (13 §3.9).
  registry: ghcr.io/mindevis/qstack
  tag: main
  pullPolicy: IfNotPresent
  pullSecrets: []

# PostgreSQL via CloudNativePG (the operator is installed cluster-wide by
# the operator of the platform). One database and role per service is
# added with the services.
postgres:
  enabled: true
  instances: 1
  image: ghcr.io/cloudnative-pg/postgresql:17.11-minimal-trixie
  storage: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}

# NATS JetStream (events, ADR-0004).
nats:
  enabled: true
  image: nats:2.15.1@sha256:023a08c46caa5aff878fb86841187bebfdad9a6e3c552ba5c1a1e18938bbf88a
  replicas: 1
  storage: 1Gi
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 512Mi}

# OpenBao (secrets, PKI). Only dev mode exists in this skeleton: in-memory,
# unsealed, random root token in the <release>-openbao-dev secret. Never in
# production (T-1.67 adds server mode with the seal of ADR-0011).
openbao:
  enabled: true
  dev: false
  image: openbao/openbao:2.6.4@sha256:cf2340fc9a22cb9358ca0defd1f39b65673836bd23fe2bb8984a07e11fe13ef4
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

# Web console (ADR-0017): Nuxt SSR + BFF, image <registry>/qs-console.
console:
  enabled: true
  replicas: 1
  # Public API for the BFF (qs-api-gateway); empty until the services exist.
  apiGatewayUrl: ""
  ingress:
    enabled: false
    className: ""
    host: "" # empty: every host
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}

# L0 only: pods that act as compute nodes running qs-node (13 §1.1).
fakeHosts:
  enabled: false
  replicas: 2
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
