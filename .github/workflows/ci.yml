name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: make verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking compares against the main branch.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            tools/go.sum
            tools/protoc/go.sum

      - name: Ensure local main ref for buf breaking
        if: github.ref != 'refs/heads/main'
        run: git fetch origin main:main || true

      - name: make verify
        run: make verify
