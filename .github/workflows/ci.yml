name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: make verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # buf breaking compares against the main branch.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            tools/go.sum
            tools/protoc/go.sum
            tools/helm/go.sum

      - name: Ensure local main ref for buf breaking
        if: github.ref != 'refs/heads/main'
        run: git fetch origin main:main || true

      - name: make verify
        run: make verify

  package:
    name: packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # Local registry for the signing smoke test; nothing is published.
      registry:
        image: registry:2
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe for package versions

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            tools/go.sum

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Build .deb
        run: make deb

      - name: .deb installs and starts under systemd
        run: test/packaging/deb-smoke.sh

      - name: OCI image is signed and verified
        run: test/packaging/image-sign.sh

  l0:
    name: L0 stand on kind
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            tools/go.sum
            tools/helm/go.sum

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          cluster_name: qstack-l0

      - name: CloudNativePG operator (cluster-wide, as on the stand)
        run: |
          kubectl apply --server-side -f https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.30.1/cnpg-1.30.1.yaml
          kubectl -n cnpg-system rollout status deployment/cnpg-controller-manager --timeout=180s
          kubectl create namespace qstack-l0

      - name: qStack images into kind
        run: |
          make image BIN=qs-node IMAGE_REPO=ghcr.io/mindevis/qstack VERSION=ci
          make console-image IMAGE_REPO=ghcr.io/mindevis/qstack VERSION=ci
          kind load docker-image ghcr.io/mindevis/qstack/qs-node:ci ghcr.io/mindevis/qstack/qs-console:ci --name qstack-l0

      - name: make dev-up (spec 13 §1.1 — under 5 minutes)
        run: make dev-up L0_IMAGE_TAG=ci L0_MAX_SECONDS=300

      - name: make dev-smoke
        run: make dev-smoke

      - name: make dev-down
        run: make dev-down

  console:
    name: console (Nuxt)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pnpm via corepack (version from package.json)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (SSR)
        run: pnpm build

      - name: Server renders pages
        run: |
          PORT=3077 node .output/server/index.mjs &
          for _ in $(seq 30); do curl -fsS http://localhost:3077/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://localhost:3077/ | grep -q "<title>"
