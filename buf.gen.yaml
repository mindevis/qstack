version: v2
managed:
  enabled: true
  disable:
    # Vendored dependencies keep their upstream Go packages
    # (paths are relative to the module root, third_party/proto).
    - path: google
    - path: buf
  override:
    - file_option: go_package_prefix
      value: github.com/mindevis/qstack/gen/go
    # Go forbids importing packages under an "internal" directory from
    # outside its parent, so qstack.<svc>.internal.v1 is generated into
    # <svc>/internalv1 instead (one entry per internal API).
    - file_option: go_package
      path: qstack/iam/internal/v1
      value: github.com/mindevis/qstack/gen/go/qstack/iam/internalv1;iaminternalv1
    - file_option: go_package
      path: qstack/resourcemanager/internal/v1
      value: github.com/mindevis/qstack/gen/go/qstack/resourcemanager/internalv1;resourcemanagerinternalv1
plugins:
  # Generators are pinned in tools/protoc/go.mod (stable protobuf releases only).
  - local: ["go", "tool", "-modfile=tools/protoc/go.mod", "protoc-gen-go"]
    out: gen/go
    opt: module=github.com/mindevis/qstack/gen/go
  - local: ["go", "tool", "-modfile=tools/protoc/go.mod", "protoc-gen-go-grpc"]
    out: gen/go
    opt: module=github.com/mindevis/qstack/gen/go
